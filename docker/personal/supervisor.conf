[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
[program:web]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --timeout=1800 --max-time=3600
user=www-data
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1850
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
